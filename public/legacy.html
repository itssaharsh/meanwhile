<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Meanwhile — a live channel of Earth</title>
    <meta name="robots" content="noindex" />
    <!-- The prototype used to live here. This redirect stays so an old link, or a tab someone
         left open, lands on the channel rather than on a page that still claimed an audience it
         could not count. -->
    <meta http-equiv="refresh" content="0; url=/" />
    <link rel="canonical" href="/" />
    <script>
      location.replace("/" + location.search);
    </script>
    <style>
      body { background: #080b11; color: #94a3b3; font: 14px/1.6 system-ui, sans-serif; padding: 48px; }
      a { color: #e8eef4; }
    </style>
  </head>
  <body>
    <p>Meanwhile has moved to <a href="/">the channel</a>.</p>
  </body>
</html>
